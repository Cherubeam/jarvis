name: Tests

# Runs the pytest suite + ruff lint/format checks on every push and pull
# request so regressions are caught before they reach main. Runs are fast
# (~10 seconds on GitHub runners) and require no secrets — all tests are
# offline unless opted into with --evaluate.

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install dependencies
        run: uv sync --extra dev --extra test --extra web

      - name: Run ruff check
        run: uv run ruff check

      - name: Run ruff format check
        run: uv run ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install dependencies
        run: uv sync --extra dev --extra test --extra web

      - name: Run mypy
        run: uv run mypy packages apps scripts jarvis_cli.py jarvis_gui.py

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install dependencies
        # `web` extra is needed by tests/unit/gui/test_conversations_route.py
        # (FastAPI TestClient). `test` pulls in pytest + fixtures.
        run: uv sync --extra test --extra web

      - name: Run pytest
        run: uv run pytest
