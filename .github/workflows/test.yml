name: Tests

# Runs the pytest suite on every push and pull request so regressions are
# caught before they reach main. Runs are fast (~10 seconds on GitHub runners)
# and require no secrets — all tests are offline unless opted into with
# --evaluate.

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run pytest
        run: uv run pytest
