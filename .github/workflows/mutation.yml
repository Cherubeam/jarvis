name: Mutation Testing

# Runs mutmut on Linux where os.fork() is safe. mutmut on macOS is currently
# unusable (every mutant segfaults); this workflow is the only environment
# where mutation testing actually executes for jarvis. See
# docs/engineering/mutation-testing-report.md for background.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # just under GitHub's 360-min job ceiling
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run mutmut
        id: mutmut_run
        continue-on-error: true
        run: uv run mutmut run 2>&1 | tee mutmut-run.log

      - name: Collect text results
        run: uv run mutmut results | tee mutmut-results.txt

      - name: Extract summary line
        run: |
          # mutmut's final progress line shows killed/survived/etc. as emoji counters.
          # Grab the last such line so downstream reviewers don't have to parse 4k+ mutants.
          grep -oE '[0-9]+/[0-9]+ +🎉 [0-9]+ 🫥 [0-9]+ +⏰ [0-9]+ +🤔 [0-9]+ +🙁 [0-9]+ +🔇 [0-9]+ +🧙 [0-9]+' mutmut-run.log \
            | tail -1 \
            | tee mutmut-summary.txt
          echo ""
          echo "Legend: 🎉 killed  🙁 survived  🫥 no tests  ⏰ timeout  🤔 suspicious  🔇 skipped  🧙 check"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-results-${{ github.run_id }}
          path: |
            mutmut-results.txt
            mutmut-summary.txt
            mutmut-run.log
          retention-days: 90

      - name: Report run outcome
        run: |
          echo "mutmut run step outcome: ${{ steps.mutmut_run.outcome }}"
          echo "Surviving mutants alone do not fail this job — download the artifact to review results."
