# JARVIS Homelab Deployment (Scenario B)
#
# Start: docker compose up
# Scale workers: docker compose up --scale worker-writer=2
#
# This is a vision/template — requires apps/worker/main.py and
# apps/web/main.py to be implemented before use.

services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3

