<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JARVIS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body, #root { height: 100%; margin: 0; padding: 0; background: #1E1E1E; }
    body { font-family: ui-monospace, Menlo, monospace; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #4A4A4A; border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-track { background: transparent; }
    /* !important: most buttons reset themselves with an inline `all: unset`,
       which would otherwise also unset the focus ring. */
    *:focus-visible { outline: 2px solid #8FB0F8 !important; outline-offset: 2px !important; border-radius: 3px; }
    /* Placeholders follow the field's text colour in both themes. */
    ::placeholder { color: inherit; opacity: .65; }
    .dots span { display: inline-block; opacity: .3; animation: blink 1.2s infinite; font-family: monospace; font-size: 18px; line-height: .5; }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .dots span { animation: none; opacity: .7 } }
    p:first-child { margin-top: 0 !important; }
    p:last-child { margin-bottom: 0 !important; }

    /* Journal layout: a gutter (time, speaker), the reading column, and a
       margin for notes (tokens, cost). Sizes mirror JARVIS_MEASURE in
       src/lib/tokens.ts. The margin drops under the text when the pane is
       narrow, so it is a container query, not a media query: the chat pane
       shrinks when the sidebar is open. */
    .jr-pane { container-type: inline-size; }
    .jr-row {
      display: grid;
      /* The margin keeps 140px; on a mid-width pane the column gives way. */
      grid-template-columns: 72px minmax(0, 640px) minmax(140px, 1fr);
      column-gap: 28px;
      align-items: baseline;
      max-width: 1000px;
      margin: 0 auto;
      padding: 10px 28px;
    }
    .jr-row.dense { padding-top: 5px; padding-bottom: 5px; }
    .jr-gutter { text-align: right; }
    @container (max-width: 820px) {
      .jr-row { grid-template-columns: 56px minmax(0, 1fr); column-gap: 16px; padding-left: 16px; padding-right: 16px; }
      .jr-margin { grid-column: 2; margin-top: 4px; }
    }
  </style>
  <script type="module" crossorigin src="/assets/index-OCbWJS4E.js"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
