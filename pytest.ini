[pytest]
# Pytest configuration for Jarvis testing

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 8.0

# Test paths
testpaths = tests

# Additional options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    --showlocals
    # Show summary of all test outcomes
    -ra
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Strict config (fail on unknown config options)
    --strict-config
    # Disable warnings summary (can be enabled with -W)
    --disable-warnings

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may involve external dependencies)
    golden: Golden test conversations
    slow: Tests that take longer to run

# Coverage options (when using --cov flag)
# Example: pytest --cov=personal-context/src --cov-report=html

# Async support
asyncio_mode = auto

# Output options
console_output_style = progress
