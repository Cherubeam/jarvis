[project]
name = "jarvis"
version = "0.11.0"
description = "Personal AI assistant with context awareness"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.1",
    "duckduckgo-search>=8.1.1",
    "httpx>=0.28.1",
    "litellm>=1.82",
    "mcp>=1.25.0",
    "prompt-toolkit>=3.0.52",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "rich>=14.3.3",
    "things-py>=1.0.1",
    "trafilatura>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "respx>=0.21.0",
    "freezegun>=1.4.0",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sse-starlette>=2.0.0",
]
rag = [
    "chromadb>=0.6.0",
]

[project.scripts]
jarvis = "jarvis_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["packages", "apps"]
omit = ["*/__init__.py", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages", "apps"]

[tool.hatch.build.targets.wheel.force-include]
"jarvis_cli.py" = "jarvis_cli.py"
