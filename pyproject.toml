[project]
name = "jarvis"
version = "0.21.0"
description = "Personal AI assistant with context awareness"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.1",
    "ddgs>=9.0.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "litellm>=1.82,<1.82.7",
    "mcp>=1.25.0",
    "prompt-toolkit>=3.0.52",
    "pydantic-settings>=2.0",
    "pymupdf>=1.27.2.2",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "rich>=14.3.3",
    "things-py>=1.0.1",
    "trafilatura>=2.0.0",
    "weasyprint>=68.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "respx>=0.21.0",
    "freezegun>=1.4.0",
    "mutmut>=3.0.0",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=2.0.0",
    "websockets>=12.0",
    "janus>=1.0.0",
]
rag = [
    "chromadb>=0.6.0",
]
dev = [
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "ruff>=0.7.0",
    "types-pyyaml>=6.0.12.20260408",
    "types-requests>=2.33.0.20260408",
]

[project.scripts]
jarvis = "jarvis_cli:main"
jarvis-gui = "jarvis_gui:main"

# Pytest configuration lives in pytest.ini (single source of truth).
# Don't add [tool.pytest.ini_options] here — pytest prefers pytest.ini when
# both exist and warns "ignoring pytest config in pyproject.toml".

[tool.coverage.run]
source = ["packages", "apps"]
omit = ["*/__init__.py", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["apps/gui/web"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]
# RUF001/RUF002: prompts intentionally use em-dashes, ellipses, and other
# typographic unicode — flagging them is noise, not a bug.
# SIM108: if/else → conditional-expression rewrites often hurt readability.
ignore = ["RUF001", "RUF002", "SIM108"]

[tool.ruff.lint.per-file-ignores]
# Test mocks legitimately use PascalCase argument names from @patch decorators
# and PascalCase local Mock* variables. Test fixtures sometimes import after
# sys.path manipulation. Tests commonly unpack tuples and ignore some entries.
"tests/**" = ["N803", "N806", "E402", "RUF059"]
# Scripts often manipulate sys.path before importing.
"scripts/**" = ["E402"]
# Tool definitions contain long LLM-facing description strings that lose
# readability when split across lines.
"packages/core/tools/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
# Pin to linux so sys.platform-narrowing is consistent between macOS dev
# machines and Linux CI. macOS-only branches (things3, weasyprint dlopen
# fallback) need # type: ignore[unreachable] under this setting.
platform = "linux"
strict = true
warn_unreachable = true
# Skills are loaded dynamically (external symlinks under packages/skills/),
# each defining its own top-level `skill.py`. Without these flags mypy
# refuses to check anything because multiple files share a module name.
namespace_packages = true
explicit_package_bases = true
exclude = ["packages/skills/.*/skill\\.py$"]
# Intentionally not strict=true on day 1 — JARVIS has heavy `dict[str, Any]`
# usage from yaml.safe_load and litellm responses that would surface
# 800-2000 errors. Ratchet rule-by-rule (disallow_untyped_defs →
# disallow_incomplete_defs → disallow_any_generics → strict) in follow-ups.

# Third-party deps that ship without type stubs, or whose stubs are
# strict enough to require a separate refactor before they're useful here.
# chromadb's stubs treat list[float] embeddings and dict[str, str] metadata
# as type errors; reconciling with our actual call sites is out of scope
# for the initial mypy gate.
[[tool.mypy.overrides]]
module = [
    "ddgs",
    "ddgs.*",
    "fitz",
    "litellm",
    "litellm.*",
    "things",
    "trafilatura",
    "trafilatura.*",
    "weasyprint",
]
ignore_missing_imports = true

# chromadb does ship types, but they're stricter than our usage (treat
# list[float] embeddings and dict[str, str] metadata as errors). Skip
# following its imports so its types resolve to Any here. Reconciling
# with the strict stubs is out of scope for the initial mypy gate.
[[tool.mypy.overrides]]
module = ["chromadb"]
follow_imports = "skip"

[tool.mutmut]
paths_to_mutate = ["packages/core/"]
tests_dir = ["tests/"]
runner = "uv run pytest -x --tb=no -q"
also_copy = ["packages/", "apps/", "config/", "data/context/", "scripts/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages", "apps"]
exclude = [
    "apps/gui/web/node_modules",
    "apps/gui/web/src",
    "apps/gui/web/index.html",
    "apps/gui/web/package.json",
    "apps/gui/web/package-lock.json",
    "apps/gui/web/tsconfig.json",
    "apps/gui/web/vite.config.ts",
]

[tool.hatch.build.targets.wheel.force-include]
"jarvis_cli.py" = "jarvis_cli.py"
"jarvis_gui.py" = "jarvis_gui.py"
