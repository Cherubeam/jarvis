# JARVIS Configuration
# This is the default configuration. Create local.yaml for local overrides.

# Model configuration
# Model IDs use full LiteLLM-routable format (provider prefix included).
# Default: GPT-6 Luna — the only low-cost model to pass all 15 golden tests
# (2026-09 refresh, avg 0.907 under an Opus 5.5 judge), ~3 s median latency,
# $0.10/$0.50 per 1M tokens. fast/balanced use it too: no faster candidate was
# reliable with tools. quality: Opus 5.5 (15/15, highest score).
# See docs/research/models.md "Default Model Recommendation" for the decision matrix.
models:
  default: "openrouter/openai/gpt-6-luna"
  default_max_tokens: 16384
  streaming: true  # false = exact usage per call, but answers appear at once. Streamed usage is estimated, then billed via the logger (packages/core/billed_usage.py)
  presets:
    fast: "openrouter/openai/gpt-6-luna"
    quality: "openrouter/anthropic/claude-opus-5.5"
    balanced: "openrouter/openai/gpt-6-luna"
  # Per-model request body fields, keyed by full model id and sent on every call
  # made with that model. Qwen 3.5 Flash otherwise returns its thinking as the answer.
  extra_body:
    "openrouter/qwen/qwen3.5-flash-02-23":
      reasoning:
        effort: "none"
  # OpenRouter Auto Router (openrouter/auto): opt-in replacement for `default` and for
  # JARVIS's own routing. Agents with `model:` in meta.yaml keep theirs; auto turns don't
  # stream. Also reachable per session via `/model auto` or `--model auto`.
  auto_router:
    enabled: false
    cost_tier: "low"          # low | medium | high | xhigh | max
    excluded_models: []       # e.g. ["google/gemini-3.5-flash-lite"]

# Paths (relative to project root)
paths:
  context_dir: "data/context"
  conversations_dir: "data/conversations"
  learned_facts: "data/learned_facts.md"
  prompt_history_dir: "data/prompt-history"

# Things 3 integration — read-only, via the "JARVIS Things Export" Shortcut
# (build it once: docs/engineering/deployment.md#things-3; ADR-037)
things3:
  enabled: true
  sync_on_startup: true
  cache_ttl_seconds: 300  # 5 minutes
  lists_to_include:
    - Today
    - Upcoming
    - Inbox
  max_tasks_per_list: 50  # Prevent context bloat

# LLM-as-judge evaluation settings
evaluation:
  judge_model: "anthropic/claude-opus-5.5"  # read by tests/golden and scripts/model_benchmark.py
  quality_threshold: 0.70  # Pass mark per case; default of --quality-threshold

  # Per-category pass marks (override quality_threshold; an explicit
  # --quality-threshold applies one mark to every case instead)
  category_thresholds:
    reasoning: 0.75
    context_recall: 0.70
    personalization: 0.70
    edge_cases: 0.65

  # Results storage (relative to the repo root)
  results_dir: "tests/golden/results"

# RAG — Conversation recall via ChromaDB + LiteLLM embeddings
rag:
  enabled: true         # on by default; set to false in local.yaml to turn recall off
  db_path: "data/rag/chroma"
  embedding_model: "openrouter/openai/text-embedding-3-small"
  index_cards: true       # index deck-skill cards (deck.yaml) when rag is enabled
  # Uses the same OPENROUTER_API_KEY already configured for chat.
  # LiteLLM's openrouter/ prefix routes natively — no api_base needed.

# Intelligent model routing (opt-in)
# Routes simple queries to fast models, complex ones to quality models.
routing:
  enabled: false                    # Set to true in local.yaml to activate
  simple_threshold: 200             # Chars below which query is "simple"
  complex_threshold: 800            # Chars above which query is "complex"

# History summarization (opt-in)
# Compresses old conversation history using the fast model to reduce token costs.
# Only triggers once when threshold is exceeded; avoids re-summarizing every turn.
summarization:
  enabled: false                    # Set to true in local.yaml to activate
  token_threshold: 40000            # Approx tokens before summarization triggers
  keep_recent: 10                   # Number of recent messages to preserve intact

# CLI display settings
cli:
  colors: true
  history_file: "data/.cli_history"

# Filesystem access control (used by Obsidian and future integrations)
# User-facing paths are configured in local.yaml. Framework-level paths
# that must work out-of-the-box (e.g., data/outcomes/) ship with defaults.
filesystem:
  access_rules:
    - path: data/outcomes
      access: read-write

# Obsidian vault integration
obsidian:
  enabled: false
  vault_path: ""                    # User sets in local.yaml
  daily_notes:
    path_format: "Daily Notes/%Y-%m-%d"
  writing:
    blog_dir: ""                    # User sets in local.yaml
    template_path: ""               # User sets in local.yaml
    patterns:
      target_dir: ""                # User sets in local.yaml
      template_path: ""             # User sets in local.yaml
    slip_box:
      target_dir: ""                # User sets in local.yaml
      template_path: ""             # User sets in local.yaml

# MCP — connect to external MCP tool servers (Model Context Protocol)
# Cortex vault search is consumed this way since HUB-01: declare the
# cortex server in local.yaml with `shared: true` so every agent gets it.
mcp:
  enabled: false              # Set to true in local.yaml
  servers: {}                 # Declare servers in local.yaml (per-server keys:
                              # transport, command/args or url, tool_group,
                              # shared, timeout_seconds, env, cwd, headers)

# Readwise integration — reading list, highlights, and persona
readwise:
  enabled: false              # Set to true in local.yaml
  cache_ttl_seconds: 300      # Cache CLI results for 5 minutes

# Outcome tracking — closed loop on advice JARVIS gives
# When enabled, JARVIS auto-captures concrete recommendations via the
# track_recommendation tool. Run /outcomes to score items past their revisit
# date. Scored outcomes feed back into RAG when rag.enabled is also true.
outcomes:
  enabled: true
  dir: "data/outcomes"

# Pattern card generator
pattern_cards:
  output_dir: "data/pattern-cards"
  image_generation:
    enabled: false                  # Set to true + provide GEMINI_API_KEY for API image gen
    model: "gemini/imagen-4.0-generate-001"
    size: "1536x640"                  # ~2.4:1 landscape to match card image slot (686x300)
    max_images_per_run: 10

# GUI server — browser-facing origin policy (see docs/engineering/gui.md).
# The auth token is NOT here: it lives in data/.gui_token or $JARVIS_GUI_TOKEN.
gui:
  # Additive — the server's own origin and the Vite dev origins are always
  # allowed. Set this when binding to a non-loopback host with --host.
  allowed_origins: []
