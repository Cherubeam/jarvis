# JARVIS Configuration
# This is the default configuration. Create local.yaml for local overrides.

# Model configuration
# Model IDs use full LiteLLM-routable format (provider prefix included).
# Default: Qwen 3.5 Flash — 100% pass rate (0.925 avg score), 66x cheaper than
# Sonnet 4.6, with confirmed tool-use support and 1M context.
# See docs/research/models.md "Default Model Recommendation" for decision matrix.
models:
  default: "openrouter/qwen/qwen3.5-flash-02-23"
  default_max_tokens: 16384
  streaming: true  # Set to false for non-streaming mode (enables prompt caching via OpenRouter)
  presets:
    fast: "openrouter/google/gemini-2.5-flash"
    quality: "openrouter/anthropic/claude-opus-4.6"
    balanced: "openrouter/qwen/qwen3.5-flash-02-23"

# Paths (relative to project root)
paths:
  context_dir: "data/context"
  conversations_dir: "data/conversations"
  learned_facts: "data/learned_facts.md"

# Things 3 integration
things3:
  enabled: true
  sync_on_startup: true
  cache_ttl_seconds: 300  # 5 minutes
  lists_to_include:
    - Today
    - Upcoming
    - Inbox
  max_tasks_per_list: 50  # Prevent context bloat

# LLM-as-judge evaluation settings
evaluation:
  judge_model: "anthropic/claude-opus-4.6"
  quality_threshold: 0.70  # Minimum score to pass

  # Category-specific thresholds (optional overrides)
  category_thresholds:
    reasoning: 0.75
    context_recall: 0.70
    personalization: 0.70
    edge_cases: 0.65

  # Results storage
  results_dir: "tests/golden/results"

  # Cost management
  max_cost_per_run: 1.00  # USD, abort if exceeded
  warn_cost_threshold: 0.50  # USD, warn but continue

# RAG — Conversation recall via ChromaDB + LiteLLM embeddings
rag:
  enabled: false          # set to true in local.yaml to activate
  db_path: "data/rag/chroma"
  embedding_model: "openrouter/openai/text-embedding-3-small"
  index_cards: true       # index deck-skill cards (deck.yaml) when rag is enabled
  # Uses the same OPENROUTER_API_KEY already configured for chat.
  # LiteLLM's openrouter/ prefix routes natively — no api_base needed.

# Intelligent model routing (opt-in)
# Routes simple queries to fast models, complex ones to quality models.
routing:
  enabled: false                    # Set to true in local.yaml to activate
  simple_threshold: 200             # Chars below which query is "simple"
  complex_threshold: 800            # Chars above which query is "complex"

# History summarization (opt-in)
# Compresses old conversation history using the fast model to reduce token costs.
# Only triggers once when threshold is exceeded; avoids re-summarizing every turn.
summarization:
  enabled: false                    # Set to true in local.yaml to activate
  token_threshold: 40000            # Approx tokens before summarization triggers
  keep_recent: 10                   # Number of recent messages to preserve intact

# CLI display settings
cli:
  colors: true
  history_file: "data/.cli_history"

# Filesystem access control (used by Obsidian and future integrations)
# User-facing paths are configured in local.yaml. Framework-level paths
# that must work out-of-the-box (e.g., data/outcomes/) ship with defaults.
filesystem:
  access_rules:
    - path: data/outcomes
      access: read-write

# Obsidian vault integration
obsidian:
  enabled: false
  vault_path: ""                    # User sets in local.yaml
  daily_notes:
    path_format: "Daily Notes/%Y-%m-%d"
  writing:
    blog_dir: ""                    # User sets in local.yaml
    template_path: ""               # User sets in local.yaml
    patterns:
      target_dir: ""                # User sets in local.yaml
      template_path: ""             # User sets in local.yaml
    slip_box:
      target_dir: ""                # User sets in local.yaml
      template_path: ""             # User sets in local.yaml

# Cortex — shared knowledge layer (semantic vault search)
cortex:
  enabled: false                    # Set to true in local.yaml to activate
  base_url: "http://127.0.0.1:8100"
  timeout_seconds: 10

# MCP — connect to external MCP tool servers (Model Context Protocol)
mcp:
  enabled: false              # Set to true in local.yaml
  servers: {}                 # Declare servers in local.yaml

# Readwise integration — reading list, highlights, and persona
readwise:
  enabled: false              # Set to true in local.yaml
  cache_ttl_seconds: 300      # Cache CLI results for 5 minutes

# Outcome tracking — closed loop on advice JARVIS gives
# When enabled, JARVIS auto-captures concrete recommendations via the
# track_recommendation tool. Run /review to score items past their revisit
# date. Scored outcomes feed back into RAG when rag.enabled is also true.
outcomes:
  enabled: true
  dir: "data/outcomes"

# Pattern card generator
pattern_cards:
  output_dir: "data/pattern-cards"
  image_generation:
    enabled: false                  # Set to true + provide GEMINI_API_KEY for API image gen
    model: "gemini/imagen-4.0-generate-001"
    size: "1536x640"                  # ~2.4:1 landscape to match card image slot (686x300)
    max_images_per_run: 10

# Developer agent — JARVIS self-improvement
developer:
  enabled: true
  scope:
    - "packages/agents/"
    - "packages/skills/"
    - "data/context/"
    - "data/prompts/"
    - "config/"
  allowed_extensions:
    - ".md"
    - ".yaml"
    - ".yml"
